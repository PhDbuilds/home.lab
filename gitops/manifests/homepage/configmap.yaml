apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - home.lab repo:
            - abbr: GH
              href: https://github.com/PhDbuilds/home.lab
  services.yaml: |
    - Argo CD:
        - Prod Argo CD:
            icon: argocd.png
            href: https://argocd.home.lab/
            description: Prod Argo CD

    - Testing:
        - Guestbook:
            icon: mdi-book-open-variant
            href: https://guestbook.home.lab/
            description: Guestbook test app
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
