---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/phdbuilds/home.lab.git
      targetRevision: master
      path: gitops/apps/platform
    - repoURL: https://github.com/phdbuilds/home.lab.git
      targetRevision: master
      path: gitops/apps/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
