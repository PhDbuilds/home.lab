name: Sync Tailscale ACLs

# Keeps the tailnet policy in sync with tailscale/policy.hujson.
#   - Pull requests: dry-run (lint + diff) so reviewers see the effect.
#   - Push to master: apply the policy to the tailnet.
#
# Requires repo secrets from a Tailscale OAuth client with the `acl` write scope:
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET

on:
  push:
    branches: [master]
    paths: ["tailscale/policy.hujson", ".github/workflows/tailscale-acl.yml"]
  pull_request:
    branches: [master]
    paths: ["tailscale/policy.hujson", ".github/workflows/tailscale-acl.yml"]

permissions:
  contents: read
  pull-requests: write

jobs:
  acls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy ACL (apply on master, dry-run on PRs)
        uses: tailscale/gitops-acl-action@v1
        with:
          api-key: ""
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: ${{ vars.TS_TAILNET }}
          policy-file: tailscale/policy.hujson
          action: ${{ github.event_name == 'pull_request' && 'test' || 'apply' }}
