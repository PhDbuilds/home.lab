---
- name: Set hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Mask Zincati
  ansible.builtin.systemd:
    name: zincati.service
    enabled: false
    masked: true
    state: stopped

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Persist modules across reboot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: "overlay\nbr_netfilter\n"
    mode: "0644"

- name: Kubernetes sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k3s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: "0644"

- name: Rancher k3s-selinux repo
  ansible.builtin.yum_repository:
    name: rancher-k3s-common-stable
    description: Rancher K3s Common (stable)
    baseurl: "https://rpm.rancher.io/k3s/stable/common/coreos/noarch"
    gpgcheck: true
    gpgkey: "https://rpm.rancher.io/public.key"

- name: Layer k3s-selinux policy
  community.general.rpm_ostree_pkg:
    name: k3s-selinux
    state: present

- name: Check for a staged rpm-ostree deployment
  ansible.builtin.command: rpm-ostree status --json
  register: ostree_status
  changed_when: false

- name: Reboot into the new deployment (when one is staged but not booted)
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: not ((ostree_status.stdout | from_json).deployments[0].booted | default(true))
