---
- name: Render kubeadm init config
  ansible.builtin.copy:
    dest: /etc/kubernetes/kubeadm-init.yaml
    mode: "0644"
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: InitConfiguration
      nodeRegistration:
        criSocket: unix:///var/run/crio/crio.sock
      ---
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      controllerManager:
        extraArgs:
          - name: flex-volume-plugin-dir
            value: /opt/libexec/kubernetes/kubelet-plugins/volume/exec
      controlPlaneEndpoint: "{{ control_plane_endpoint }}:6443"
      networking:
        podSubnet: "{{ pod_subnet }}"
        serviceSubnet: "{{ service_subnet }}"
      ---
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      cgroupDriver: systemd
      volumePluginDir: /opt/libexec/kubernetes/kubelet-plugins/volume/exec

- name: kubeadm init
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --config /etc/kubernetes/kubeadm-init.yaml
      --skip-phases=addon/kube-proxy
    creates: /etc/kubernetes/admin.conf

- name: kubeconfig for the core user
  block:
    - ansible.builtin.file:
        path: /var/home/core/.kube
        state: directory
        owner: core
        group: core
        mode: "0700"
    - ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /var/home/core/.kube/config
        remote_src: true
        owner: core
        group: core
        mode: "0600"

- name: Fetch admin.conf to sirius for local kubectl
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: ./admin.conf
    flat: true

- name: Fetch helm
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: /tmp/linux-amd64/helm
- name: Install helm to /usr/local/bin (writable on FCOS)
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: true

- name: Add Cilium helm repo
  ansible.builtin.command: helm repo add cilium https://helm.cilium.io
  register: repo
  changed_when: "'has been added' in repo.stdout"
  failed_when: repo.rc != 0 and 'already exists' not in repo.stderr
- name: Update repo
  ansible.builtin.command: helm repo update cilium

- name: Render Cilium values
  ansible.builtin.copy:
    dest: /etc/kubernetes/cilium-values.yaml
    mode: "0644"
    content: |
      kubeProxyReplacement: true
      k8sServiceHost: "{{ control_plane_ip }}"
      k8sServicePort: 6443
      ipam:
        mode: kubernetes
      l2announcements:
        enabled: true
      k8sClientRateLimit:
        qps: 10
        burst: 20
      ingressController:
        enabled: true
        default: true
        loadbalancerMode: shared
  register: cilium_values

- name: Upgrade Cilium
  ansible.builtin.command:
    cmd: >
      helm upgrade --install cilium cilium/cilium
      --namespace kube-system
      --version {{ cilium_version }}
      -f /etc/kubernetes/cilium-values.yaml

- name: Restart cilium-operator to register Envoy/ingress CRDs
  ansible.builtin.command: kubectl -n kube-system rollout restart deploy/cilium-operator
  when: cilium_values.changed

- name: Wait for cilium-operator
  ansible.builtin.command: kubectl -n kube-system rollout status deploy/cilium-operator --timeout=120s
  when: cilium_values.changed

- name: Recreate cilium agents (fresh config; CRDs now exist)
  ansible.builtin.command: kubectl -n kube-system rollout restart ds/cilium
  when: cilium_values.changed

- name: Wait for cilium agents
  ansible.builtin.command: kubectl -n kube-system rollout status ds/cilium --timeout=240s
  when: cilium_values.changed

- name: Render CoreDNS config (kubeadm default + home.lab -> Pi-hole)
  ansible.builtin.copy:
    dest: /etc/kubernetes/coredns-config.yaml
    mode: "0644"
    content: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: coredns
        namespace: kube-system
      data:
        Corefile: |
          .:53 {
              errors
              health {
                 lameduck 5s
              }
              ready
              kubernetes cluster.local in-addr.arpa ip6.arpa {
                 pods insecure
                 fallthrough in-addr.arpa ip6.arpa
                 ttl 30
              }
              prometheus :9153
              forward . /etc/resolv.conf {
                 max_concurrent 1000
              }
              cache 30 {
                 disable success cluster.local
                 disable denial cluster.local
              }
              loop
              reload
              loadbalance
          }
          home.lab:53 {
              errors
              cache 30
              forward . 10.0.0.53
          }
  register: coredns_cfg

- name: Apply CoreDNS config
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/coredns-config.yaml

- name: Restart CoreDNS
  ansible.builtin.command: kubectl -n kube-system rollout restart deployment coredns
  when: coredns_cfg.changed
