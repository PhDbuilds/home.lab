---
- name: Ensure tooling is present
  ansible.builtin.package:
    name:
      - git
      - vim
    state: present

- name: Install kubectl from dl.k8s.io
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/v{{ k8s_version }}/bin/linux/{{ arch }}/{{ k8s_binary }}"
    dest: "{{ bin_dir }}/{{ k8s_binary }}"
    owner: root
    group: root
    mode: "0755"
